<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習レポート 利用コスト台帳</title>
<style>
  :root {
    --bg: #0e0d0b;
    --panel: #17150f;
    --line: #2c2820;
    --ink: #e8e2d0;
    --ink-dim: #948d78;
    --gold: #d4a84b;
    --gold-dim: #7a672f;
    --sonnet: #6fa8dc;
    --opus: #d4a84b;
    --haiku: #7ec99a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  header {
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }
  header p { margin: 0; color: var(--ink-dim); font-size: 0.9rem; }

  .totals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 40px;
  }
  .totals div {
    background: var(--panel);
    padding: 18px 16px;
  }
  .totals .num {
    font-variant-numeric: tabular-nums;
    font-size: 1.4rem;
    color: var(--gold);
    font-weight: 600;
  }
  .totals .label {
    color: var(--ink-dim);
    font-size: 0.78rem;
    margin-top: 4px;
  }

  section { margin-bottom: 44px; }
  h2 {
    font-size: 0.95rem;
    color: var(--ink-dim);
    font-weight: 600;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }

  .bars { display: flex; flex-direction: column; gap: 14px; }
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .bar-row .theme {
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-row .theme a { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--ink-dim); }
  .bar-row .theme a:hover { color: var(--gold); }
  .bar-track {
    grid-column: 1 / -1;
    height: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    overflow: hidden;
  }
  .bar-seg { height: 100%; }
  .bar-row .cost {
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
    color: var(--gold);
    white-space: nowrap;
  }

  .legend { display: flex; gap: 18px; font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 18px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th {
    color: var(--ink-dim);
    font-weight: 500;
    font-size: 0.74rem;
  }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.theme-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }

  .empty {
    color: var(--ink-dim);
    font-size: 0.88rem;
    padding: 32px 0;
    text-align: center;
    border: 1px dashed var(--line);
  }

  footer { color: var(--ink-dim); font-size: 0.76rem; border-top: 1px solid var(--line); padding-top: 16px; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #faf8f3;
      --panel: #ffffff;
      --line: #e3ddc9;
      --ink: #2a2517;
      --ink-dim: #877d63;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学習レポート 利用コスト台帳</h1>
    <p>/report コマンドで生成した各レポートの、推定トークン消費とコスト</p>
  </header>

  <div class="totals" id="totals"></div>

  <section>
    <h2>レポートごとの内訳</h2>
    <div class="legend">
      <span><i class="dot" style="background:var(--sonnet)"></i>Sonnet 5</span>
      <span><i class="dot" style="background:var(--opus)"></i>Opus 5</span>
      <span><i class="dot" style="background:var(--haiku)"></i>Haiku 4.5</span>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section>
    <h2>全履歴</h2>
    <div class="table-scroll">
      <table id="table">
        <thead>
          <tr>
            <th>日時</th>
            <th>テーマ</th>
            <th>モデル</th>
            <th class="num">input</th>
            <th class="num">output</th>
            <th class="num">cost (USD)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <footer>
    reports/usage-log.csv を読み込んで表示しています。金額は会話ログのトークン数をAPI料金に換算した目安です。Pro/Maxプランでは実際に請求されるわけではなく、プランの利用枠の消費量は Claude Code の /usage で確認できます。
  </footer>
</div>

<script>
const MODEL_COLOR = {
  'claude-sonnet-5': 'var(--sonnet)',
  'claude-opus-5': 'var(--opus)',
  'claude-haiku-4-5-20251001': 'var(--haiku)',
};
const MODEL_LABEL = {
  'claude-sonnet-5': 'Sonnet 5',
  'claude-opus-5': 'Opus 5',
  'claude-haiku-4-5-20251001': 'Haiku 4.5',
};

function parseCSV(text) {
  const lines = text.replace(/\r/g, '').trim().split('\n');
  const headers = splitCSVLine(lines[0]);
  return lines.slice(1).map(line => {
    const cells = splitCSVLine(line);
    const row = {};
    headers.forEach((h, i) => row[h] = cells[i]);
    return row;
  });
}

function splitCSVLine(line) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { cur += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtUSD(n) { return '$' + n.toFixed(4); }
function fmtInt(n) { return Number(n).toLocaleString('en-US'); }

async function load() {
  let rows = [];
  try {
    const res = await fetch('reports/usage-log.csv', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    const text = await res.text();
    rows = parseCSV(text).filter(r => r.timestamp);
  } catch (e) {
    document.getElementById('bars').innerHTML = '<div class="empty">まだ記録がありません。/report を1回実行すると、ここに表示されます。</div>';
    document.getElementById('totals').innerHTML = '';
    return;
  }

  if (rows.length === 0) {
    document.getElementById('bars').innerHTML = '<div class="empty">まだ記録がありません。/report を1回実行すると、ここに表示されます。</div>';
    return;
  }

  // グループ化: file(なければtheme)ごとにまとめる
  const groups = {};
  for (const r of rows) {
    const key = r.run_id || r.file || r.theme;
    if (!groups[key]) groups[key] = { theme: r.theme, file: r.file, timestamp: r.timestamp, models: {} };
    groups[key].models[r.model] = {
      input: Number(r.input_tokens) || 0,
      output: Number(r.output_tokens) || 0,
      cost: Number(r.cost_usd) || 0,
    };
    if (r.timestamp > groups[key].timestamp) groups[key].timestamp = r.timestamp;
  }
  const groupList = Object.values(groups).sort((a, b) => b.timestamp.localeCompare(a.timestamp));

  // 合計
  let totalCost = 0, totalIn = 0, totalOut = 0;
  for (const r of rows) {
    totalCost += Number(r.cost_usd) || 0;
    totalIn += Number(r.input_tokens) || 0;
    totalOut += Number(r.output_tokens) || 0;
  }
  document.getElementById('totals').innerHTML = `
    <div><div class="num">${fmtUSD(totalCost)}</div><div class="label">累計コスト（推定）</div></div>
    <div><div class="num">${groupList.length}</div><div class="label">レポート件数</div></div>
    <div><div class="num">${fmtUSD(groupList.length ? totalCost / groupList.length : 0)}</div><div class="label">1件あたり平均</div></div>
  `;

  // 棒グラフ
  const maxCost = Math.max(...groupList.map(g => Object.values(g.models).reduce((s, m) => s + m.cost, 0)));
  const barsHtml = groupList.map(g => {
    const modelCosts = Object.entries(g.models);
    const gcost = modelCosts.reduce((s, [, m]) => s + m.cost, 0);
    const segs = modelCosts.map(([model, m]) => {
      const pct = maxCost ? (m.cost / maxCost) * 100 : 0;
      return `<div class="bar-seg" style="width:${pct}%;background:${MODEL_COLOR[model] || '#888'}"></div>`;
    }).join('');
    const link = g.file ? `<a href="${esc(g.file)}">${esc(g.theme)}</a>` : esc(g.theme);
    return `
      <div class="bar-row">
        <div class="theme">${link}</div>
        <div class="cost">${fmtUSD(gcost)}</div>
        <div class="bar-track">${segs}</div>
      </div>`;
  }).join('');
  document.getElementById('bars').innerHTML = barsHtml;

  // テーブル
  const sorted = [...rows].sort((a, b) => b.timestamp.localeCompare(a.timestamp));
  const tbody = document.querySelector('#table tbody');
  tbody.innerHTML = sorted.map(r => `
    <tr>
      <td>${(r.timestamp || '').replace('T', ' ').slice(0, 16)}</td>
      <td class="theme-cell">${esc(r.theme)}</td>
      <td>${MODEL_LABEL[r.model] || esc(r.model)}</td>
      <td class="num">${fmtInt(r.input_tokens)}</td>
      <td class="num">${fmtInt(r.output_tokens)}</td>
      <td class="num">${fmtUSD(Number(r.cost_usd) || 0)}</td>
    </tr>
  `).join('');
}

load();
</script>
</body>
</html>
